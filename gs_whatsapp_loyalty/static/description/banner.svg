    <circle cx="91" cy="75" r="5" fill="#61dfb1"/>
    <text x="106" y="81" fill="#e8fff7" font-size="14" font-weight="700" letter-spacing="1.2">SMARTDESKSOLUTIONS</text>

    <text x="72" y="164" fill="#ffffff" font-size="43" font-weight="700">GS WhatsApp Loyalty</text>
    <text x="72" y="216" fill="#ffffff" font-size="43" font-weight="700">Notifications</text>
    <rect x="74" y="244" width="56" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="284" fill="#d6e5f1" font-size="19">Keep customers informed at every loyalty milestone.</text>
    <text x="72" y="316" fill="#d6e5f1" font-size="16">OTP verification  ·  Purchases  ·  Rewards  ·  Expiry alerts</text>
    <text x="72" y="372" fill="#ffffff" font-size="14" font-weight="700">www.smartdesksolutions.com</text>
    <circle cx="269" cy="367" r="2.5" fill="#61dfb1"/>
    <text x="284" y="372" fill="#ffffff" font-size="14" font-weight="700">info@smartdesksolutions.com</text>

    <g filter="url(#shadow)">
      <rect x="777" y="55" width="338" height="292" rx="28" fill="#ffffff"/>
      <rect x="795" y="73" width="302" height="48" rx="15" fill="#f3f8fa"/>
      <circle cx="820" cy="97" r="13" fill="#20c997"/>
      <path d="M814 97h12m-6-6v12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="844" y="102" fill="#17344b" font-size="15" font-weight="700">Loyalty updates</text>
      <text x="1071" y="101" fill="#94a7b5" font-size="20">···</text>

      <rect x="815" y="142" width="258" height="70" rx="17" fill="#eaf8f1"/>
