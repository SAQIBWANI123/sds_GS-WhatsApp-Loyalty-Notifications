      <text x="866" y="273" fill="#31546a" font-size="14">Your points balance</text>
      <text x="866" y="298" fill="#17344b" font-size="18" font-weight="700">1,250 points</text>
      <circle cx="1051" cy="281" r="11" fill="#20c997"/>
      <path d="M1046 281l4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
