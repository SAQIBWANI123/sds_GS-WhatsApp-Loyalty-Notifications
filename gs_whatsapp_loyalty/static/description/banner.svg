<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">GS WhatsApp Loyalty Notifications</title>
  <desc id="description">Connect Odoo loyalty events with customer WhatsApp notifications.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233f"/>
      <stop offset="1" stop-color="#174b68"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20c997"/>
      <stop offset="1" stop-color="#61dfb1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#07182a" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="400" rx="0" fill="url(#background)"/>
  <circle cx="1090" cy="68" r="205" fill="#ffffff" opacity=".035"/>
  <circle cx="1130" cy="360" r="155" fill="#20c997" opacity=".08"/>
  <path d="M0 335C170 286 248 414 430 361s291-84 431-22 237 42 339-2v63H0z" fill="#ffffff" opacity=".035"/>

  <g font-family="Arial, Helvetica, sans-serif">
